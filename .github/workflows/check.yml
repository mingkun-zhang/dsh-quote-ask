name: check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: syntax + contract test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check and test
        run: node scripts/check.mjs
