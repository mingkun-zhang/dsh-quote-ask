<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="dsh-quote-ask workflow: select text in the main conversation, right-click, ask in a side chat">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="26" fill="#0B1220"/>
  <text x="60" y="58" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">主对话</text>
  <text x="640" y="58" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">侧边聊天</text>

  <!-- left: main conversation -->
  <rect x="50" y="82" width="500" height="420" rx="18" fill="#111A2E" stroke="#26344F" filter="url(#shadow)"/>
  <rect x="82" y="116" width="300" height="16" rx="8" fill="#334155"/>
  <rect x="82" y="146" width="420" height="12" rx="6" fill="#1E293B"/>
  <rect x="82" y="168" width="390" height="12" rx="6" fill="#1E293B"/>
  <rect x="82" y="208" width="430" height="44" rx="10" fill="#1B2740"/>
  <rect x="98" y="224" width="286" height="14" rx="7" fill="#E2E8F0" opacity="0.9"/>
  <rect x="98" y="244" width="240" height="10" rx="5" fill="#94A3B8" opacity="0.5"/>
  <rect x="82" y="270" width="430" height="100" rx="12" fill="#0E1628" stroke="#334155"/>
  <rect x="100" y="290" width="140" height="12" rx="6" fill="#94A3B8" opacity="0.55"/>
  <rect x="100" y="314" width="360" height="12" rx="6" fill="#94A3B8" opacity="0.35"/>
  <rect x="100" y="336" width="330" height="12" rx="6" fill="#94A3B8" opacity="0.35"/>
  <rect x="120" y="312" width="168" height="20" rx="5" fill="#4D6BFE" opacity="0.35"/>
  <rect x="120" y="312" width="168" height="20" rx="5" fill="none" stroke="#93C5FD" stroke-dasharray="5 4"/>
  <text x="82" y="392" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="14">选中任意一段文字</text>
  <!-- context menu -->
  <rect x="330" y="398" width="188" height="76" rx="12" fill="#1F2A44" stroke="#3B4B6B" filter="url(#shadow)"/>
  <text x="346" y="426" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14">在侧边聊天中提问</text>
  <line x1="342" y1="436" x2="506" y2="436" stroke="#334155"/>
  <text x="346" y="458" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14">添加到侧边聊天引用</text>

  <!-- arrow -->
  <path d="M562 310 C602 310 606 310 628 310" stroke="#4D6BFE" stroke-width="3" fill="none"/>
  <path d="M628 300 L644 310 L628 320" stroke="#4D6BFE" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="566" y="272" width="72" height="26" rx="13" fill="#17233D" stroke="#31446B"/>
  <text x="602" y="290" fill="#C7D2FE" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">右键</text>

  <!-- right: side chat -->
  <rect x="650" y="82" width="500" height="420" rx="18" fill="#111A2E" stroke="#26344F" filter="url(#shadow)"/>
  <rect x="650" y="82" width="500" height="48" rx="18" fill="#17233D"/>
  <text x="678" y="112" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="14">侧聊 · 主对话标题</text>
  <rect x="946" y="98" width="180" height="20" rx="10" fill="#0F1A2E"/>
  <text x="1036" y="112" fill="#64748B" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">仅模型可见的主对话上下文</text>

  <!-- quote chip inside composer -->
  <rect x="680" y="158" width="220" height="34" rx="17" fill="#17233D" stroke="#3B4B6B"/>
  <text x="700" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="16">❝</text>
  <text x="722" y="180" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">已选文本片段 · 1</text>
  <text x="680" y="214" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">引用已锁定到主对话中的精确位置</text>

  <!-- answer body -->
  <rect x="680" y="236" width="440" height="176" rx="12" fill="#0E1628" stroke="#26344F"/>
  <rect x="700" y="260" width="360" height="12" rx="6" fill="#94A3B8" opacity="0.45"/>
  <rect x="700" y="284" width="400" height="12" rx="6" fill="#94A3B8" opacity="0.32"/>
  <rect x="700" y="308" width="330" height="12" rx="6" fill="#94A3B8" opacity="0.32"/>
  <rect x="700" y="344" width="220" height="16" rx="8" fill="#4D6BFE" opacity="0.55"/>
  <text x="680" y="438" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">界面不显示继承的历史消息</text>
  <text x="680" y="462" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">关闭标签页 → 会话、日志、缓存、草稿全部删除</text>

  <text x="60" y="536" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">MIT licensed · desktop-only DSH plugin · no network access</text>
</svg>
